
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thanhphong10A7 - Video</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;padding:25px}
main{max-width:650px;margin:45px auto;background:#1d293b;padding:25px;border-radius:18px}
h1{text-align:center;color:#8dc8ff}
p{text-align:center;color:#bdc9d8}
input,button{width:100%;padding:14px;margin:10px 0;border:0;border-radius:9px}
button{background:#3188e8;color:white;font-weight:bold;cursor:pointer}
video{width:100%;max-height:70vh;background:#000;border-radius:12px;margin-top:15px}
a{display:block;text-align:center;color:#8dc8ff;margin:15px}
#status{text-align:center;color:#a8d8ff;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>thanhphong10A7</h1>
<p>Không gian chia sẻ video lớp 10A7</p>

<section id="upload">
<h3>Đăng tải video</h3>
<input id="file" type="file" accept="video/mp4,video/quicktime,video/webm">
<button onclick="upload()">Tải video lên</button>
</section>

<section id="viewer" hidden>
<h3>Video được chia sẻ</h3>
<video id="player" controls playsinline></video>
<a id="download" target="_blank" rel="noopener">Tải video xuống</a>
</section>
<p id="status"></p>
</main>

<script>
const CLOUD_NAME="jhby0mcc";
const UPLOAD_PRESET="thanhphong10a7";

const params=new URLSearchParams(location.search);
const video=params.get("video");
const expires=Number(params.get("expires"));
const status=document.getElementById("status");

if(video){
 document.getElementById("upload").hidden=true;
 if(!expires || Date.now()>expires){
  status.textContent="Liên kết đã hết hạn hoặc không hợp lệ.";
 }else{
  document.getElementById("viewer").hidden=false;
  document.getElementById("player").src=video;
  document.getElementById("download").href=video;
  status.textContent="Liên kết có thời hạn 24 giờ.";
 }
}

async function upload(){
 const file=document.getElementById("file").files[0];
 if(!file){status.textContent="Hãy chọn video trước.";return;}
 if(!file.type.startsWith("video/")){status.textContent="Tệp không phải video.";return;}
 const button=document.querySelector("button");
 button.disabled=true;
 status.textContent="Đang tải video lên, vui lòng chờ...";
 try{
  const data=new FormData();
  data.append("file",file);
  data.append("upload_preset",UPLOAD_PRESET);
  const response=await fetch(
   `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`,
   {method:"POST",body:data}
  );
  const result=await response.json();
  if(!response.ok) throw new Error(result.error?.message||"Upload thất bại");
  const expiry=Date.now()+24*60*60*1000;
  const link=new URL(location.href);
  link.search="";
  link.searchParams.set("video",result.secure_url);
  link.searchParams.set("expires",expiry);
  await navigator.clipboard.writeText(link.href);
  status.textContent="Tải lên thành công! Link 24 giờ đã được sao chép.";
  status.insertAdjacentHTML("beforeend",
   '<br><a id="sharelink"></a>');
  const a=document.getElementById("sharelink");
  a.href=link.href;a.textContent="Mở đường link chia sẻ";
 }catch(e){
  status.textContent="Lỗi: "+e.message;
 }finally{button.disabled=false;}
}
</script>
</body>
</html>
